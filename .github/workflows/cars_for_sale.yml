name: Cars For Sale

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  start_marker:
    runs-on: ubuntu-latest
    steps:
      - name: Record run start time on R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          pip install boto3
          python << 'EOF'
          import boto3, os, json
          from datetime import datetime, timezone

          dt = datetime.now(timezone.utc)
          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = os.environ['CF_R2_BUCKET_NAME']
          key = f"qatarsale/monitor/year={dt.year}/month={dt.strftime('%m')}/day={dt.strftime('%d')}/_run_started_at.json"
          client.put_object(Bucket=bucket, Key=key, Body=json.dumps({"started_at": dt.isoformat()}).encode(),
              ContentType='application/json; charset=utf-8')
          print(f"Marked run start -> {key}")
          EOF

  detect_pages:
    runs-on: ubuntu-latest
    needs: start_marker
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt

      - name: Detect pages
        id: build_matrix

        run: |
          python << 'EOF'

          import requests
          import json
          import math
          import os

          URL = "https://production-api.qatarsale.com/api/v2/Products"

          payload = {
              "url": "/ar/products/cars_for_sale?basic_search:StatusFilter=0",
              "includeFavs": False,
              "pageSize": 36
          }

          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://qatarsale.com/",
              "Origin": "https://qatarsale.com",
          }

          response = requests.post(URL, json=payload, headers=headers, timeout=30)

          if response.status_code == 200:
              data = response.json()
              print(f"✅ pagesCount: {data['pagesCount']}")
              print(f"✅ totalCount: {data['totalCount']}")
          else:
              print(f"❌ Failed")
              print(f"Headers: {dict(response.headers)}")
              print(f"Body (first 1000 chars): {response.text[:1000]}")

          last_page = data['pagesCount']
          
          N_JOBS = 10

          pages_per_job = math.ceil(last_page / N_JOBS)

          matrix = {"include": []}

          for i in range(N_JOBS):

              start = i * pages_per_job + 1
              end = min((i + 1) * pages_per_job, last_page)

              if start > last_page:
                  break

              matrix["include"].append({
                  "start": start,
                  "end": end
              })

          print(json.dumps(matrix, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}")

          EOF

  scrape:
    needs: detect_pages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.detect_pages.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Common_files/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt

      - name: Run scraper
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python -u Cars-for-sale/main.py ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv-${{ matrix.start }}-${{ matrix.end }}
          path: |
            all_products_flat_${{ matrix.start }}_${{ matrix.end }}.csv
            all_products_${{ matrix.start }}_${{ matrix.end }}_failed.txt
            request_stats_${{ matrix.start }}_${{ matrix.end }}.json
  merge:
    runs-on: ubuntu-latest
    needs: scrape
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandas
        run: pip install pandas boto3 openpyxl

      - name: Download all CSV artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: csv-*
          merge-multiple: true
          path: csv_parts/

      - name: Merge and analyze
        id: merge
        run: |
          python << 'EOF'
          import pandas as pd
          import glob
          from datetime import datetime, timezone
          import json
          from Common_files.build_summary import build_category_summary

          files = glob.glob('csv_parts/*.csv')
          if not files:
              print("No CSV files for yesterday across any job -- nothing to merge or upload.")
              with open("HAS_DATA", "w") as f:
                  f.write("false")
              exit(0)

          dfs = [pd.read_csv(f) for f in files]
          merged = pd.concat(dfs, ignore_index=True)
          merged = merged.drop_duplicates(subset=['product_url'], keep='first')

          # cars_for_sale.xlsx here is a temp working file only -- split_by_manufacturer.py
          # reads it, then it's deleted; the combined file is never uploaded to R2.
          merged.to_excel('cars_for_sale.xlsx', index=False)

          json_file = "cars_for_sale.json"
          json_data = merged.to_dict(orient='records')
          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(json_data, f, ensure_ascii=False, indent=2)
          print(f"JSON saved: {json_file} ({len(json_data)} records)")

          dt = datetime.now(timezone.utc)
          summary = build_category_summary(merged, dt)
          with open("summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(f"Summary saved: summary.json ({summary['total_subcategories']} subcats, {summary['total_listings']} listings)")

          print(f'Found {len(files)} CSV files to merge')
          print(f'Total Rows: {len(merged)}')

          failed_links = collect_failed_links('csv_parts/*_failed.txt')
          total_scraped = sum(len(df) for df in all_sheets.values())
          failed_report = build_failed_report(failed_links, total_scraped)
          with open("failed.json", "w", encoding="utf-8") as f:
              json.dump(failed_report, f, ensure_ascii=False, indent=2)

          failed_key = f"{base}/summary/failed.json"
          client.upload_file("failed.json", bucket, failed_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Failed report uploaded: {failed_key} ({failed_report['total_failed']} failed)")


          # ---- request_metrics.json (replaces performance_report.json) ----
          metrics = aggregate_request_stats('csv_parts/request_stats_*.json')
          with open("request_metrics.json", "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)

          metrics_key = f"{base}/summary/request_metrics.json"
          client.upload_file("request_metrics.json", bucket, metrics_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Request metrics uploaded: {metrics_key} ({metrics['requests_total']} req, {metrics['requests_per_min']} req/min)")
          EOF

          
          with open("HAS_DATA", "w") as f:
              f.write("true")
          EOF

          if [ -f HAS_DATA ] && grep -q "true" HAS_DATA; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split by manufacturer
        if: steps.merge.outputs.has_data == 'true'
        run: |
          pip install openpyxl
          python Common_files.split_by_manufacturer.py cars_for_sale.xlsx excel_by_manufacturer

      - name: Upload Excel files to R2
        if: steps.merge.outputs.has_data == 'true'
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import boto3, os, glob, json
          from datetime import datetime
          import pandas as pd

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          dt = datetime.now()
          prefix = f"qatarsale/year={dt.year}/month={dt.strftime('%m')}/day={dt.strftime('%d')}/cars_for_sale/excel"
          bucket = os.environ['CF_R2_BUCKET_NAME']

          for f in glob.glob('excel_by_manufacturer/*.xlsx'):
              key = f"{prefix}/{os.path.basename(f)}"
              client.upload_file(f, bucket, key,
                  ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
              print(f"Uploaded: {key}")

              # Convert each Excel to JSON and upload
              df_split = pd.read_excel(f)
              json_split_file = f"{os.path.splitext(f)[0]}.json"
              df_split.to_dict(orient='records')
              with open(json_split_file, 'w', encoding='utf-8') as jf:
                  json.dump(df_split.to_dict(orient='records'), jf, ensure_ascii=False, indent=2)
                  
              json_prefix = f"qatarsale/year={dt.year}/month={dt.strftime('%m')}/day={dt.strftime('%d')}/cars_for_sale/json"
              json_key = f"{json_prefix}/{os.path.basename(json_split_file)}"
              client.upload_file(json_split_file, bucket, json_key,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"Uploaded JSON: {json_key}")
          EOF

      - name: Upload summary to R2
        if: steps.merge.outputs.has_data == 'true'
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import boto3, os
          from datetime import datetime

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          dt = datetime.now()
          bucket = os.environ['CF_R2_BUCKET_NAME']
          key = f"qatarsale/year={dt.year}/month={dt.strftime('%m')}/day={dt.strftime('%d')}/cars_for_sale/summary/summary.json"

          client.upload_file('summary.json', bucket, key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f'Uploaded summary: {key}')
          EOF
      
      
