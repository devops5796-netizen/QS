name: Sub Categories

on:
  workflow_run:
    workflows: ["Simple Categories"]
    types:
      - completed
  workflow_dispatch:

jobs:
  detect_pages:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Detect pages and build matrix
        id: build_matrix
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python << 'EOF'
          import json
          import os
          from Common_files.detect_utils import analyze_category_with_products

          MULTI_CATEGORIES = {
                "car_spare_parts_accessories-automotive_exterior_accessories":
                    "https://qatarsale.com/ar/products/car_spare_parts_accessories-automotive_exterior_accessories?basic_search:StatusFilter=0",
                "heavy_equipments":
                    "https://qatarsale.com/ar/products/heavy_equipments?basic_search:StatusFilter=0",
                "car_spare_parts_accessories":
                    "https://qatarsale.com/ar/products/car_spare_parts_accessories?basic_search:StatusFilter=0",
                "jewellery":
                    "https://qatarsale.com/ar/products/jewellery?basic_search:StatusFilter=0",
                "property":
                    "https://qatarsale.com/ar/products/property?basic_search:StatusFilter=0",
                "watercrafts":
                    "https://qatarsale.com/ar/products/watercrafts?basic_search:StatusFilter=0",
                "computers_and_parts":
                    "https://qatarsale.com/ar/products/computers_and_parts?basic_search:StatusFilter=0",
                "video_games":
                    "https://qatarsale.com/ar/products/video_games?basic_search:StatusFilter=0",
                "wrist_watches":
                    "https://qatarsale.com/ar/products/wrist_watches?basic_search:StatusFilter=0",
                "home_security_surveillance_systems":
                    "https://qatarsale.com/ar/products/home_security_surveillance_systems?basic_search:StatusFilter=0",
                "health_beauty":
                    "https://qatarsale.com/ar/products/health_beauty?basic_search:StatusFilter=0",
                "toys_games":
                    "https://qatarsale.com/ar/products/toys_games?basic_search:StatusFilter=0",
                "kids":
                    "https://qatarsale.com/ar/products/kids?basic_search:StatusFilter=0",
                "shoes_bags":
                    "https://qatarsale.com/ar/products/shoes_bags?basic_search:StatusFilter=0",
                "arts_crafts_sewing":
                    "https://qatarsale.com/ar/products/arts_crafts_sewing?basic_search:StatusFilter=0",
                "kitchen_dining_room":
                    "https://qatarsale.com/ar/products/kitchen_dining_room?basic_search:StatusFilter=0",
                "education":
                    "https://qatarsale.com/ar/products/education?basic_search:StatusFilter=0",
                "bikes_accessories":
                    "https://qatarsale.com/ar/products/bikes_accessories?basic_search:StatusFilter=0",
                "clothes":
                    "https://qatarsale.com/ar/products/clothes?basic_search:StatusFilter=0",
                "camping":
                    "https://qatarsale.com/ar/products/camping?basic_search:StatusFilter=0",
                "tools_home_improvement":
                    "https://qatarsale.com/ar/products/tools_home_improvement?basic_search:StatusFilter=0",
                "men_accessories":
                    "https://qatarsale.com/ar/products/men_accessories?basic_search:StatusFilter=0",
                "musical_instruments":
                      "https://qatarsale.com/ar/products/musical_instruments?basic_search:StatusFilter=0",
                "travel_accessories":
                      "https://qatarsale.com/ar/products/travel_accessories?basic_search:StatusFilter=0",
                "special_numbers":
                      "https://qatarsale.com/ar/products/special_numbers?basic_search:StatusFilter=0",
          }

          PAGES_PER_JOB = {cat: 20 for cat in MULTI_CATEGORIES}

          matrix = {"include": []}

          for category, url in MULTI_CATEGORIES.items():
              print(f"Detecting pages for {category}...")
              try:
                  last_page, has_products = analyze_category_with_products(url)
              except Exception as e:
                  print(f"  Failed: {e}")
                  continue

              if not has_products:
                  print(f"  ⚠️ No products in {category}, skipping...")
                  continue

              print(f"  {category}: {last_page} pages")

              category_path = url.replace("https://qatarsale.com", "")
              pages_per_job = PAGES_PER_JOB.get(category, 20)

              for i in range(0, last_page, pages_per_job):
                  start = i + 1
                  end   = min(i + pages_per_job, last_page)
                  matrix["include"].append({
                      "category":      category,
                      "category_path": category_path,
                      "start":         start,
                      "end":           end,
                  })

          print(f"Total jobs: {len(matrix['include'])}")
          print(f"Matrix: {json.dumps(matrix, indent=2, ensure_ascii=False)}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix, ensure_ascii=False)}\n")
          EOF

  scrape_subcats:
    runs-on: ubuntu-latest
    needs: detect_pages
    strategy:
      matrix: ${{ fromJson(needs.detect_pages.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Common_files/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt

      - name: Run scraper for category pages
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          export PYTHONPATH=$PWD
          python -u Sub_and_Sub_Sub_Categories/main.py \
            "${{ matrix.category }}" \
            "${{ matrix.category_path }}" \
            ${{ matrix.start }} \
            ${{ matrix.end }}

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-excel-${{ matrix.category }}-${{ matrix.start }}-${{ matrix.end }}
          path: |
            *.xlsx
            products_${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}_failed.txt
            request_stats_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: ignore
      

  merge_subcats:
    runs-on: ubuntu-latest
    needs: scrape_subcats

    strategy:
      matrix:
        category:
          - car_spare_parts_accessories-automotive_exterior_accessories
          - heavy_equipments
          - car_spare_parts_accessories
          - jewellery
          - property
          - watercrafts
          - computers_and_parts
          - video_games
          - wrist_watches
          - home_security_surveillance_systems
          - health_beauty
          - toys_games
          - kids
          - shoes_bags
          - arts_crafts_sewing
          - kitchen_dining_room
          - education
          - bikes_accessories
          - clothes
          - camping
          - tools_home_improvement
          - men_accessories
          - musical_instruments
          - travel_accessories
          - special_numbers

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Download artifacts for ${{ matrix.category }}
        uses: actions/download-artifact@v4
        with:
          pattern: multi-excel-${{ matrix.category }}-*
          merge-multiple: true
          path: excel_parts/      

      - name: Merge sheets and upload
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import pandas as pd
          import glob, os, boto3, json
          from datetime import datetime, timezone
          from Common_files.r2_uploader import upload_final_batch_assets
          from Common_files.build_summary import build_category_summary
          from Common_files.monitor_helpers import collect_failed_links, aggregate_request_stats, build_failed_report

          category = "${{ matrix.category }}"

          def merge_group(file_pattern: str) -> dict:
              """Reads all Excel files matching file_pattern, merges sheets by
              subcategory name (dedup on product_url), returns {sheet_name: df}."""
              files = glob.glob(file_pattern)
              sheets = {}
              for f in files:
                  xl = pd.ExcelFile(f)
                  for sheet in xl.sheet_names:
                      df = xl.parse(sheet)
                      if sheet in sheets:
                          sheets[sheet] = pd.concat([sheets[sheet], df], ignore_index=True)
                      else:
                          sheets[sheet] = df
              for sheet in sheets:
                  sheets[sheet] = sheets[sheet].drop_duplicates(subset=['product_url'], keep='first')
              return sheets

          def write_and_upload(sheets: dict, filename_base: str, base_key: str, client, bucket) -> pd.DataFrame:
              combined_df = pd.concat(sheets.values(), ignore_index=True) if sheets else pd.DataFrame()
              if combined_df.empty:
                  print(f"  {filename_base}: no data, skipping.")
                  return combined_df

              excel_path = f"{filename_base}.xlsx"
              with pd.ExcelWriter(excel_path, engine="openpyxl") as writer:
                  for sheet_name, df in sheets.items():
                      safe = sheet_name.replace("/", "-").replace("\\", "-").replace("*", "").replace("?", "").replace(":", "-")
                      df.to_excel(writer, sheet_name=safe, index=False)
              print(f"  Excel saved: {excel_path} ({len(combined_df)} rows)")

              json_path = f"{filename_base}.json"
              with open(json_path, 'w', encoding='utf-8') as f:
                  json.dump(combined_df.to_dict(orient='records'), f, ensure_ascii=False, indent=2)

              excel_key = f"{base_key}/excel/{filename_base}.xlsx"
              client.upload_file(excel_path, bucket, excel_key,
                  ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
              print(f"  Excel uploaded: {excel_key}")

              json_key = f"{base_key}/json/{filename_base}.json"
              client.upload_file(json_path, bucket, json_key,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"  JSON uploaded: {json_key}")

              return combined_df

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = os.environ['CF_R2_BUCKET_NAME']
          dt_local = datetime.now()
          base_key = f"qatarsale/year={dt_local.year}/month={dt_local.strftime('%m')}/day={dt_local.strftime('%d')}/{category}"

          if category == "property":
              sale_sheets = merge_group('excel_parts/property_for_sale_*.xlsx')
              rent_sheets = merge_group('excel_parts/property_for_rent_*.xlsx')

              sale_df = write_and_upload(sale_sheets, "property_for_sale", base_key, client, bucket)
              rent_df = write_and_upload(rent_sheets, "property_for_rent", base_key, client, bucket)

              if sale_df.empty and rent_df.empty:
                  print("No property data for sale or rent -- skipping summary/failed/metrics.")
                  exit(0)

              combined_df = pd.concat([sale_df, rent_df], ignore_index=True)

          else:
              sheets = merge_group('excel_parts/*.xlsx')
              combined_df = pd.concat(sheets.values(), ignore_index=True) if sheets else pd.DataFrame()

              if combined_df.empty:
                  print(f"Merged result is empty for {category} -- skipping all uploads.")
                  exit(0)

              output_file = f"{category}.xlsx"
              with pd.ExcelWriter(output_file, engine="openpyxl") as writer:
                  for sheet_name, df in sheets.items():
                      safe = sheet_name.replace("/", "-").replace("\\", "-").replace("*", "").replace("?", "").replace(":", "-")
                      df.to_excel(writer, sheet_name=safe, index=False)
              print(f"Excel saved: {output_file}")

              all_data = combined_df.to_dict(orient='records')
              json_file = f"{category}.json"
              with open(json_file, 'w', encoding='utf-8') as f:
                  json.dump(all_data, f, ensure_ascii=False, indent=2)
              print(f"JSON saved: {json_file} ({len(all_data)} records)")

              result = upload_final_batch_assets(
                  images_folder="", final_excel=output_file,
                  folder_name="qatarsale", category=category
              )
              print(f"Upload result: {result}")

              json_key = f"{base_key}/json/{category}.json"
              client.upload_file(json_file, bucket, json_key,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"JSON uploaded: {json_key}")

          dt = datetime.now(timezone.utc)
          summary = build_category_summary(combined_df, dt)
          summary_file = "summary.json"
          with open(summary_file, "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(f"Summary saved: {summary_file} ({summary['total_subcategories']} subcats, {summary['total_listings']} listings)")

          summary_key = f"{base_key}/summary/summary.json"
          client.upload_file(summary_file, bucket, summary_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Summary uploaded: {summary_key}")

          failed_links = collect_failed_links('excel_parts/*_failed.txt')
          failed_report = build_failed_report(failed_links, len(combined_df))
          with open("failed.json", "w", encoding="utf-8") as f:
              json.dump(failed_report, f, ensure_ascii=False, indent=2)

          failed_key = f"{base_key}/summary/failed.json"
          client.upload_file("failed.json", bucket, failed_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Failed report uploaded: {failed_key} ({failed_report['total_failed']} failed)")

          metrics = aggregate_request_stats('excel_parts/request_stats_*.json')
          with open("request_metrics.json", "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)

          metrics_key = f"{base_key}/summary/request_metrics.json"
          client.upload_file("request_metrics.json", bucket, metrics_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Request metrics uploaded: {metrics_key} ({metrics['requests_total']} req, {metrics['requests_per_min']} req/min)")
          EOF



  