name: Showrooms Single Category

on:
  workflow_call:
    inputs:
      category:
        required: true
        type: string  # cars_for_sale | cars_for_rent

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: detect all showroom URLs and build the matrix
  # ─────────────────────────────────────────────────────────────
  detect_showrooms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      total:  ${{ steps.build_matrix.outputs.total }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Detect showrooms and build matrix
        id: build_matrix
        env:
          PYTHONUNBUFFERED: "1"
          CATEGORY: ${{ inputs.category }}
        run: |
          python << 'EOF'
          import json, os
          from Showrooms.showroom_parser import get_showroom_links

          category  = os.environ["CATEGORY"]
          showrooms = get_showroom_links(category)
          total     = len(showrooms)

          matrix = {"include": []}

          if total == 0:
              print("❌ No showrooms found, skipping")
              matrix = {"include": [{"index": 0, "url": "none", "name": "none"}]}
          else:
              for i, url in enumerate(showrooms):
                  name = (
                      url.split("/ar/showroom/")[-1].split("/")[0]
                      if "/ar/showroom/" in url
                      else f"showroom_{i}"
                  )
                  matrix["include"].append({"index": i, "url": url, "name": name})

          print(f"📊 [{category}] Total jobs: {len(matrix['include'])}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"total={total}\n")
          EOF

  # ─────────────────────────────────────────────────────────────
  # JOB 2: scrape each showroom in parallel (matrix)
  # ─────────────────────────────────────────────────────────────
  scrape_showrooms:
    runs-on: ubuntu-latest
    needs: detect_showrooms
    if: needs.detect_showrooms.outputs.total != '0'
    strategy:
      matrix: ${{ fromJson(needs.detect_showrooms.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-showrooms-${{ hashFiles('Common_files/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files/requirements.txt
          pip install requests openpyxl

      - name: Run showroom scraper
        env:
          CF_R2_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL:      ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME:       ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          echo "🔄 [${{ inputs.category }}] Showroom ${{ matrix.index }}: ${{ matrix.name }}"
          echo "URL: ${{ matrix.url }}"
          export PYTHONPATH=$PWD
          python -u Showrooms/showroom_main.py "${{ matrix.url }}" "${{ inputs.category }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: showroom-${{ inputs.category }}-${{ matrix.index }}-${{ matrix.name }}
          path: |
            showroom_*.xlsx
            *_failed.txt
            request_stats_*.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # JOB 3: merge all showroom Excels + upload to R2
  # ─────────────────────────────────────────────────────────────
  merge_showrooms:
    runs-on: ubuntu-latest
    needs: scrape_showrooms
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Download all showroom artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: showroom-${{ inputs.category }}-*
          merge-multiple: true
          path: showroom_parts/

      - name: Merge and upload to R2
        env:
          CF_R2_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL:      ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME:       ${{ secrets.CF_R2_BUCKET_NAME }}
          CATEGORY: ${{ inputs.category }}
        run: |
          python << 'EOF'
          import pandas as pd
          import glob, os, boto3, json
          from datetime import datetime, timezone
          from Common_files.monitor_helpers import aggregate_request_stats, collect_failed_links, build_failed_report

          category = os.environ["CATEGORY"]
          dt = datetime.now(timezone.utc)
          base_path = f"qatarsale/year={dt.year}/month={dt.strftime('%m')}/day={dt.strftime('%d')}/showrooms_{category}"

          excel_files  = glob.glob("showroom_parts/showroom_*.xlsx")
          failed_files = glob.glob("showroom_parts/*_failed.txt")
          print(f"Found {len(excel_files)} Excel files, {len(failed_files)} failed files")

          bucket = os.environ["CF_R2_BUCKET_NAME"]
          client = boto3.client(
              "s3",
              endpoint_url          = os.environ["CF_R2_ENDPOINT_URL"],
              aws_access_key_id     = os.environ["CF_R2_ACCESS_KEY_ID"],
              aws_secret_access_key = os.environ["CF_R2_SECRET_ACCESS_KEY"],
              region_name           = "auto",
          )

          # ── merge Excel files ────────────────────────────────────────────
          success_sheets   = []
          empty_showrooms  = []
          failed_showrooms = []
          all_data = []

          with pd.ExcelWriter("all_showrooms.xlsx", engine="openpyxl") as writer:
              for f in excel_files:
                  try:
                      base_name  = os.path.basename(f)
                      sheet_name = base_name.replace("showroom_", "").replace(".xlsx", "")[:31]
                      df         = pd.read_excel(f, sheet_name=0)

                      is_empty_marker = (
                          len(df) == 1
                          and "status" in df.columns
                          and str(df["status"].iloc[0]) == "empty - no products found"
                      )

                      if df.empty or is_empty_marker:
                          empty_showrooms.append(sheet_name)
                          print(f"  ⚠ EMPTY: {sheet_name}")
                          continue

                      original = sheet_name
                      counter  = 1
                      while sheet_name in writer.sheets:
                          sheet_name = f"{original}_{counter}"
                          counter   += 1

                      df.to_excel(writer, sheet_name=sheet_name, index=False)
                      success_sheets.append({"name": sheet_name, "rows": len(df)})
                      print(f"  ✓ {sheet_name}: {len(df)} rows")

                      sheet_data = df.to_dict(orient='records')
                      for record in sheet_data:
                          record['showroom'] = sheet_name
                      all_data.extend(sheet_data)

                  except Exception as e:
                      sheet_name = os.path.basename(f).replace("showroom_", "").replace(".xlsx", "")[:31]
                      failed_showrooms.append(sheet_name)
                      print(f"  ✗ FAILED: {sheet_name} — {e}")

              if not success_sheets:
                  placeholder = pd.DataFrame([{
                      "status": "no products found in any showroom",
                      "showrooms_checked": len(excel_files),
                      "empty_showrooms": len(empty_showrooms),
                  }])
                  placeholder.to_excel(writer, sheet_name="summary", index=False)
                  print("  ℹ No successful sheets — wrote placeholder 'summary' sheet")

          print(f"\n{'='*40}")
          print(f"[{category}] Success:      {len(success_sheets)}")
          print(f"[{category}] Empty:        {len(empty_showrooms)}")
          print(f"[{category}] Failed read:  {len(failed_showrooms)}")
          print(f"[{category}] Total records: {len(all_data)}")

          # ── upload merged Excel ──────────────────────────────────────────
          excel_key = f"{base_path}/excel/all_showrooms.xlsx"
          client.upload_file("all_showrooms.xlsx", bucket, excel_key,
              ExtraArgs={"ContentType": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})
          print(f"✅ Uploaded: {excel_key}")

          # ── JSON matching the Excel ───────────────────────────────────────
          json_file = "all_showrooms.json"
          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(all_data, f, ensure_ascii=False, indent=2)

          json_key = f"{base_path}/json/all_showrooms.json"
          client.upload_file(json_file, bucket, json_key,
              ExtraArgs={"ContentType": "application/json; charset=utf-8"})
          print(f"✅ Uploaded: {json_key}")

          # ── summary.json (subcategories = showrooms, matching the shared shape) ──
          summary = {
              "scraped_at": dt.isoformat(),
              "data_scraped_date": (dt - pd.Timedelta(days=1)).strftime("%Y-%m-%d"),
              "saved_to_R2_date": dt.strftime("%Y-%m-%d"),
              "total_subcategories": len(success_sheets),
              "total_listings": len(all_data),
              "subcategories": [
                  {
                      "name_ar": "",
                      "name_en": s["name"],
                      "slug": s["name"],
                      "listings_count": s["rows"],
                      "has_subcategories": False,
                      "subcategories": [],
                  }
                  for s in success_sheets
              ],
          }
          with open("summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)

          summary_key = f"{base_path}/summary/summary.json"
          client.upload_file("summary.json", bucket, summary_key,
              ExtraArgs={"ContentType": "application/json; charset=utf-8"})
          print(f"✅ Uploaded: {summary_key} ({summary['total_subcategories']} showrooms, {summary['total_listings']} listings)")

          # ── failed.json (numbers + links) ─────────────────────────────────
          failed_links = collect_failed_links("showroom_parts/*_failed.txt")
          failed_report = build_failed_report(failed_links, len(all_data))
          failed_report["failed_to_read_showrooms"] = failed_showrooms
          failed_report["empty_showrooms"] = empty_showrooms
          with open("failed.json", "w", encoding="utf-8") as f:
              json.dump(failed_report, f, ensure_ascii=False, indent=2)

          failed_key = f"{base_path}/summary/failed.json"
          client.upload_file("failed.json", bucket, failed_key,
              ExtraArgs={"ContentType": "application/json; charset=utf-8"})
          print(f"✅ Uploaded: {failed_key} ({failed_report['total_failed']} failed)")

          # ── request_metrics.json (will be all zeros until tracker is added -- see note) ──
          metrics = aggregate_request_stats("showroom_parts/request_stats_*.json")
          with open("request_metrics.json", "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)

          metrics_key = f"{base_path}/summary/request_metrics.json"
          client.upload_file("request_metrics.json", bucket, metrics_key,
              ExtraArgs={"ContentType": "application/json; charset=utf-8"})
          print(f"✅ Uploaded: {metrics_key} ({metrics['requests_total']} req, {metrics['requests_per_min']} req/min)")

          print("\nDone!")
          EOF