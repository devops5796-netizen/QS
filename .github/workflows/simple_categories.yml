name: Simple Categories

on:
  workflow_run:
    workflows: ["Users"]
    types:
      - completed
  workflow_dispatch:

jobs:
  detect_pages:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Detect pages and build matrix
        id: build_matrix
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python << 'EOF'
          import json
          import os
          import sys
          sys.path.insert(0, "Common_files")
          from detect_utils import analyze_category_with_products

          CATEGORIES = {
              "cars_for_rent":                 "https://qatarsale.com/ar/products/cars_for_rent?basic_search:StatusFilter=0",
              "bikes":                         "https://qatarsale.com/ar/products/bikes?basic_search:StatusFilter=0",
              "caravan":                       "https://qatarsale.com/ar/products/caravan?basic_search:StatusFilter=0",
              "gift_items":                    "https://qatarsale.com/ar/products/gift_items?basic_search:StatusFilter=0",
              "escalator":                     "https://qatarsale.com/ar/products/escalator?basic_search:StatusFilter=0",
              "air_beds_sleeping_bags":        "https://qatarsale.com/ar/products/air_beds_sleeping_bags?basic_search:StatusFilter=0",
              "cashier_machines":              "https://qatarsale.com/ar/products/cashier_machines?basic_search:StatusFilter=0",
              "elevators":                     "https://qatarsale.com/ar/products/elevators?basic_search:StatusFilter=0",
              "generators":                    "https://qatarsale.com/ar/products/generators?basic_search:StatusFilter=0",
              "building_materials":            "https://qatarsale.com/ar/products/building_materials?basic_search:StatusFilter=0",
              "shaving_hair_removal_products": "https://qatarsale.com/ar/products/shaving_hair_removal_products?basic_search:StatusFilter=0",
              "metal_detector":                "https://qatarsale.com/ar/products/metal_detector?basic_search:StatusFilter=0",
              "aquariums":                     "https://qatarsale.com/ar/products/aquariums?basic_search:StatusFilter=0",
              "business_industrial":           "https://qatarsale.com/ar/products/business_industrial?basic_search:StatusFilter=0",
              "pumps":                         "https://qatarsale.com/ar/products/pumps?basic_search:StatusFilter=0",
              "walkie_talkie":                 "https://qatarsale.com/ar/products/walkie_talkie?basic_search:StatusFilter=0",
              "glasses":                       "https://qatarsale.com/ar/products/glasses?basic_search:StatusFilter=0",
              "safe_boxes":                    "https://qatarsale.com/ar/products/safe_boxes?basic_search:StatusFilter=0",
              "tracking_systems":              "https://qatarsale.com/ar/products/tracking_systems?basic_search:StatusFilter=0",
              "pet_accessories":               "https://qatarsale.com/ar/products/pet_accessories?basic_search:StatusFilter=0",
              "stamps":                        "https://qatarsale.com/ar/products/stamps?basic_search:StatusFilter=0",
              "inflatable_games":              "https://qatarsale.com/ar/products/inflatable_games?basic_search:StatusFilter=0",
              "porta_cabin":                   "https://qatarsale.com/ar/products/porta_cabin?basic_search:StatusFilter=0",
              "fishing_equipment":             "https://qatarsale.com/ar/products/fishing_equipment?basic_search:StatusFilter=0"
          }

          JOBS_PER_CATEGORY = {cat: 20 for cat in CATEGORIES}

          matrix = {"include": []}

          for category, url in CATEGORIES.items():
              print(f"Detecting pages for {category}...")
              try:
                  last_page, has_products = analyze_category_with_products(url)
              except Exception as e:
                  print(f"  Failed: {e}")
                  continue

              if not has_products:
                  print(f"  ⚠️ No products in {category}, skipping...")
                  continue

              print(f"  {category}: {last_page} pages")

              pages_per_job = JOBS_PER_CATEGORY.get(category, 20)

              for i in range(0, last_page, pages_per_job):
                  start = i + 1
                  end   = min(i + pages_per_job, last_page)
                  matrix["include"].append({
                      "category": category,
                      "start":    start,
                      "end":      end
                  })

          print(f"Total jobs: {len(matrix['include'])}")
          print(f"Matrix: {json.dumps(matrix, indent=2, ensure_ascii=False)}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix, ensure_ascii=False)}\n")
          EOF

  scrape:
    runs-on: ubuntu-latest
    needs: detect_pages
    strategy:
      matrix: ${{ fromJson(needs.detect_pages.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('Common_files.requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r Common_files.requirements.txt

      - name: Run scraper
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python -u Simple_Category/main.py "${{ matrix.category }}" ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-${{ matrix.category }}-${{ matrix.start }}-${{ matrix.end }}
          path: |
            ${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}.xlsx
            products_${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}_failed.txt
            request_stats_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: ignore

  merge:
    runs-on: ubuntu-latest
    needs: scrape

    strategy:
      matrix:
        category: [cars_for_rent, bikes, caravan, gift_items, escalator, air_beds_sleeping_bags, 
                   cashier_machines, elevators, generators, building_materials, 
                   shaving_hair_removal_products, metal_detector, aquariums, business_industrial, 
                   pumps, walkie_talkie, glasses, safe_boxes, tracking_systems, pet_accessories, 
                   stamps, inflatable_games, porta_cabin, fishing_equipment]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Download artifacts for ${{ matrix.category }}
        uses: actions/download-artifact@v4
        with:
          pattern: excel-${{ matrix.category }}-*
          merge-multiple: true
          path: excel_parts/

      - name: Merge and upload ${{ matrix.category }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import pandas as pd
          import glob, os, boto3, subprocess, json
          from datetime import datetime, timezone
          from Common_files.r2_uploader  import upload_final_batch_assets
          from Common_files.build_summary import build_category_summary

          category = "${{ matrix.category }}"
          files = glob.glob('excel_parts/*.xlsx')

          if not files:
              print(f"No Excel files found for {category} -- nothing scraped for yesterday, skipping all uploads.")
              exit(0)

          all_sheets = {}
          for f in files:
              xl = pd.ExcelFile(f)
              for sheet in xl.sheet_names:
                  df = xl.parse(sheet)
                  if sheet in all_sheets:
                      all_sheets[sheet] = pd.concat([all_sheets[sheet], df], ignore_index=True)
                  else:
                      all_sheets[sheet] = df

          for sheet in all_sheets:
              all_sheets[sheet] = all_sheets[sheet].drop_duplicates(subset=['product_url'], keep='first')

          combined_df = pd.concat(all_sheets.values(), ignore_index=True) if all_sheets else pd.DataFrame()

          if combined_df.empty:
              print(f"Merged result is empty for {category} -- skipping all uploads.")
              exit(0)

          total = len(combined_df)

          output_file = f"{category}.xlsx"
          with pd.ExcelWriter(output_file, engine="openpyxl") as writer:
              for sheet_name, df in all_sheets.items():
                  safe = sheet_name[:31].replace("/", "-").replace("\\", "-").replace("*", "").replace("?", "").replace(":", "-")
                  df.to_excel(writer, sheet_name=safe, index=False)
                  print(f"  Sheet '{safe}': {len(df)} rows")

          print(f"Category: {category} | Rows: {total} | Files merged: {len(files)}")

          result = upload_final_batch_assets(
              images_folder="",
              final_excel=output_file,
              folder_name="qatarsale",
              category=category
          )
          print(f"Upload result: {result}")

          json_file = f"{category}.json"
          all_data = combined_df.to_dict(orient='records')
          with open(json_file, 'w', encoding='utf-8') as f:
              json.dump(all_data, f, ensure_ascii=False, indent=2)
          print(f"JSON saved: {json_file} ({len(all_data)} records)")

          dt = datetime.now(timezone.utc)
          summary = build_category_summary(combined_df, dt, level=0)
          summary_file = "summary.json"
          with open(summary_file, "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)
          print(f"Summary saved: {summary_file} ({summary['total_subcategories']} entries, {summary['total_listings']} listings)")

          summary_key = f"{base_key}/summary/summary.json"
          client.upload_file(summary_file, bucket, summary_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Summary uploaded: {summary_key}")

          if category == "cars_for_rent":
              subprocess.run(["python", "split_by_manufacturer.py", output_file, f"excel_by_manufacturer_{category}"], check=True)

              prefix = f"{base_key}/excel"
              json_prefix = f"{base_key}/json"
              for f in glob.glob(f"excel_by_manufacturer_{category}/*.xlsx"):
                  key = f"{prefix}/{os.path.basename(f)}"
                  client.upload_file(f, bucket, key,
                      ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
                  print(f"Uploaded: {key}")

                  df_split = pd.read_excel(f)
                  json_split_file = f"{os.path.splitext(f)[0]}.json"
                  with open(json_split_file, 'w', encoding='utf-8') as jf:
                      json.dump(df_split.to_dict(orient='records'), jf, ensure_ascii=False, indent=2)

                  json_key2 = f"{json_prefix}/{os.path.basename(json_split_file)}"
                  client.upload_file(json_split_file, bucket, json_key2,
                      ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
                  print(f"Uploaded JSON: {json_key2}")
          else:
              result = upload_final_batch_assets(
                  images_folder="",
                  final_excel=output_file,
                  folder_name="qatarsale",
                  category=category
              )
              print(f"Upload result: {result}")

              json_file = f"{category}.json"
              with open(json_file, 'w', encoding='utf-8') as f:
                  json.dump(all_data, f, ensure_ascii=False, indent=2)
              print(f"JSON saved: {json_file} ({len(all_data)} records)")

              json_key = f"{base_key}/json/{category}.json"
              client.upload_file(json_file, bucket, json_key,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"JSON uploaded: {json_key}")

          failed_links = collect_failed_links('excel_parts/*_failed.txt')
          total_scraped = sum(len(df) for df in all_sheets.values())
          failed_report = build_failed_report(failed_links, total_scraped)
          with open("failed.json", "w", encoding="utf-8") as f:
              json.dump(failed_report, f, ensure_ascii=False, indent=2)

          failed_key = f"{base}/summary/failed.json"
          client.upload_file("failed.json", bucket, failed_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Failed report uploaded: {failed_key} ({failed_report['total_failed']} failed)")


          # ---- request_metrics.json (replaces performance_report.json) ----
          metrics = aggregate_request_stats('excel_parts/request_stats_*.json')
          with open("request_metrics.json", "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)

          metrics_key = f"{base}/summary/request_metrics.json"
          client.upload_file("request_metrics.json", bucket, metrics_key,
              ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
          print(f"Request metrics uploaded: {metrics_key} ({metrics['requests_total']} req, {metrics['requests_per_min']} req/min)")
          EOF

